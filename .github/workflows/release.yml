name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm --prefix frontend install
          npm --prefix backend install

      - name: Build Frontend & Windows EXE
        run: |
          npm --prefix frontend run build
          npx electron-builder --win

      - name: Build Android APK
        working-directory: frontend
        run: |
          npx cap sync android
          cd android
          .\gradlew.bat assembleDebug

      - name: Collect Release Binaries
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist-bin
          if (Test-Path "frontend/android/app/build/outputs/apk/debug/app-debug.apk") {
            Copy-Item "frontend/android/app/build/outputs/apk/debug/app-debug.apk" -Destination "dist-bin/universal-shared-v$ver.apk"
          }
          Get-ChildItem -Path "dist-electron" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist-bin/$($_.Name)"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Universal Shared ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-bin/*
