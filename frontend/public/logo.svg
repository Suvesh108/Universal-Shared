<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Transfer Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#bgGrad)" filter="url(#mainShadow)" />
  <rect x="34" y="34" width="444" height="444" rx="114" stroke="rgba(255, 255, 255, 0.28)" stroke-width="4" fill="none" />

  <!-- ICON: Multi-Device Sync & Share Canvas -->
  <g filter="url(#cardShadow)">
    <!-- Back Floating Device / Layer -->
    <rect x="188" y="120" width="184" height="248" rx="36" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="5" />

    <!-- Front Clipboard Card -->
    <rect x="140" y="156" width="188" height="252" rx="36" fill="url(#frontCardGrad)" />

    <!-- Clipboard Header Clip -->
    <rect x="194" y="136" width="80" height="36" rx="16" fill="#4f46e5" stroke="#ffffff" stroke-width="4.5" />

    <!-- Shared Content Bars -->
    <rect x="176" y="214" width="116" height="20" rx="10" fill="#6366f1" />
    <rect x="176" y="254" width="84" height="18" rx="9" fill="#94a3b8" />
    <rect x="176" y="288" width="104" height="18" rx="9" fill="#cbd5e1" />

    <!-- Active Instant Share / Transfer Orb -->
    <circle cx="346" cy="344" r="50" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="6.5" />

    <!-- Fast Transfer Arrow Icon -->
    <path d="M330 344h32M348 330l14 14-14 14" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
