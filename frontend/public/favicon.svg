<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="126" height="126" rx="33" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" fill="none" />

  <!-- Back Layer Device -->
  <rect x="46" y="26" width="50" height="66" rx="10" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />

  <!-- Front Clipboard Device -->
  <rect x="32" y="36" width="52" height="68" rx="10" fill="#ffffff" />
  
  <!-- Clip Tab -->
  <rect x="46" y="30" width="24" height="12" rx="5" fill="#4f46e5" stroke="#ffffff" stroke-width="2" />

  <!-- Content Lines -->
  <rect x="42" y="52" width="32" height="5" rx="2.5" fill="#6366f1" />
  <rect x="42" y="62" width="24" height="4.5" rx="2.25" fill="#94a3b8" />
  <rect x="42" y="71" width="28" height="4.5" rx="2.25" fill="#cbd5e1" />

  <!-- Share Badge -->
  <circle cx="88" cy="86" r="16" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5" />
  <path d="M83 86h10M89 82l4 4-4 4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
