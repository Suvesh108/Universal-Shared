<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shape -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="126" height="126" rx="31" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" fill="none" />

  <!-- US Typography -->
  <text x="56" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-3" fill="url(#textGrad)" text-anchor="middle">US</text>
  
  <!-- Glowing Dot / Live Share Dot -->
  <circle cx="102" cy="78" r="8.5" fill="url(#dotGrad)" stroke="#ffffff" stroke-width="2" />
</svg>
